app = "lazy-hl-mcp"
primary_region = "ord"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]

[env]
  DB_PATH = "/data/hl-mcp.db"
  HL_DEXES = "xyz"
  HL_HTTP_TIMEOUT = "8s"

[mounts]
  source = "hl_mcp_data"
  destination = "/data"
  snapshot_retention = 14
  auto_extend_size_threshold = 80
  auto_extend_size_increment = "1GB"
  auto_extend_size_limit = "5GB"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 60

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "30s"
  method = "GET"
  path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
